<div class="page" id="p-party">
  <!-- 雙欄排版容器：王者榮耀 / MOBA 電競風格側邊導覽欄 (如圖一) + 右側主視圖區 -->
  <div class="party-moba-wrapper">
    <!-- 左側王者榮耀風格垂直導覽側欄 (如使用者圖一，頂天立地) -->
    <div class="party-moba-sidebar" id="party-moba-sidebar">
      <!-- 頂部返回箭頭 (如圖一頂部圖標) -->
      <div class="moba-sidebar-back-wrap" onclick="switchPartyNav('lobby')" title="返回隊伍大廳">
        <svg class="moba-back-arrow-svg" viewBox="0 0 24 24">
          <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </div>

      <!-- 選單標籤 1：隊伍大廳 (圖一風格) -->
      <div class="moba-tab-item active" id="party-nav-lobby" onclick="switchPartyNav('lobby')" title="隊伍大廳">
        <div class="moba-tab-icon">🌐</div>
        <div class="moba-tab-label">隊伍大廳</div>
        <div class="moba-tab-badge" id="party-nav-lobby-count">0</div>
      </div>

      <!-- 選單標籤 2：當前房間 (僅入房後動態顯示，未入房隱藏) -->
      <div class="moba-tab-item" id="party-nav-my-room" onclick="switchPartyNav('room')" title="檢視我的隊伍房間" style="display:none">
        <div class="moba-tab-icon">🎮</div>
        <div class="moba-tab-label" id="party-nav-room-title">我的隊伍</div>
        <div class="moba-tab-dot" id="party-nav-room-dot" style="display:none"></div>
      </div>

      <!-- 側欄折疊/展開小箭頭 (圖一中間的小圓圈 < ) -->
      <div class="moba-sidebar-collapse-btn" id="party-moba-collapse-btn" onclick="toggleMobaSidebar()" title="收合/展開側欄">
        <span id="moba-collapse-icon">❮</span>
      </div>
    </div>

    <!-- 右側主視圖區 (Main Viewport) -->
    <div class="party-moba-viewport">
      <!-- 頂部個人狀態與雲端配額橫幅 (固定頂部，不隨滾輪滾動) -->
      <div class="party-header-bar">
        <div class="party-profile-pill">
          <div class="party-avatar-icon">🎮</div>
          <div class="party-profile-info">
            <!-- 顯示模式 -->
            <div class="party-name-row" id="party-name-display-wrap">
              <span class="party-nickname" id="party-my-name">載入中…</span>
              <button class="party-btn-edit-name" id="party-btn-edit-name" onclick="startInlineEditName()" title="點擊直接修改暱稱">✏️</button>
            </div>
            <!-- 行內編輯模式 (預設隱藏) -->
            <div class="party-name-row" id="party-name-edit-wrap" style="display:none">
              <input type="text" id="input-inline-nickname" class="party-inline-input" maxlength="24" placeholder="輸入組隊暱稱…" onkeydown="handleInlineNicknameKey(event)">
              <button class="party-inline-btn btn-save" onclick="saveInlineNickname()" title="儲存 (Enter)">✓</button>
              <button class="party-inline-btn btn-cancel" onclick="cancelInlineEditName()" title="取消 (Esc)">✕</button>
            </div>
          </div>
        </div>

        <!-- 雲端大廳配額監控徽章 -->
        <div class="party-quota-badge" id="party-quota-badge" title="Supabase 全球高速雲端資料庫 (高可用叢集 · 充沛)">
          <span class="quota-dot green"></span>
          <span class="quota-title">雲端大廳</span>
          <span class="quota-val" id="party-quota-text">Supabase · 充沛</span>
        </div>

        <div class="party-header-actions">
          <button class="btn btn-party-create btn-s" id="btn-party-create-room" onclick="handlePartyCreateOrRecruit()" title="創建專屬組隊房間並開始招募隊友">➕ 創建房間</button>
          <button class="btn btn-o btn-s" id="party-btn-refresh" onclick="refreshPartyLobby(true)" title="立即刷新大廳">🔄 刷新</button>
        </div>
      </div>
      <!-- 視圖 A：全網公開組隊大廳 (當未進入任何房間或點選大廳時顯示) -->
      <div id="party-lobby-view" class="party-subview active">
        <!-- 搜尋與快速加入條 -->
        <div class="party-toolbar-row">
          <div class="party-search-wrap">
            <input type="text" id="party-search-input" placeholder="🔍 搜尋遊戲名稱、房號或房主..." oninput="onPartySearchInput()">
          </div>
          <div class="party-quick-join-wrap">
            <input type="text" id="party-quick-code" maxlength="8" placeholder="輸入邀請碼" onkeyup="if(event.key==='Enter') quickJoinPartyRoom()">
            <button class="btn btn-p btn-s" onclick="quickJoinPartyRoom()">加入房間</button>
          </div>
        </div>

        <!-- 房間清單容器 -->
        <div id="party-rooms-container" class="party-rooms-grid">
          <!-- 動態填充房間卡片 -->
          <div class="empty party-loading-empty">
            <div class="icon">🌸</div>
            <p>正在同步全網組隊大廳房間清單…</p>
          </div>
        </div>
      </div>

      <!-- 視圖 B：招募隊友 / 房間內部詳細檢視 -->
      <div id="party-room-view" class="party-subview" style="display:none">
        <div class="party-room-container">
          <!-- 頂部房間頭部資訊 -->
          <div class="party-room-header-card">
            <div class="party-room-banner" id="party-room-cover-wrap">
              <img id="party-room-cover-img" src="" alt="遊戲封面" style="display:none">
              <div class="party-room-banner-placeholder" id="party-room-cover-placeholder">🎮</div>
            </div>
            <div class="party-room-info">
              <div class="party-room-title-row">
                <h2 id="party-room-game-title" class="party-room-game-title">載入中…</h2>
                <span class="party-room-appid-badge" id="party-room-appid-badge" style="display:none"></span>
              </div>
              <div class="party-room-meta-row">
                <div class="party-room-code-pill" onclick="copyPartyRoomCode()" title="點擊複製房號分享給隊友">
                  <span class="code-label">房號：</span>
                  <span class="code-val" id="party-room-code-val">------</span>
                  <span class="copy-icon">📋</span>
                </div>
                <span class="party-room-players-badge" id="party-room-players-val">👥 0 / 0 人</span>
                <span class="party-room-role-badge" id="party-room-role-val">隊員</span>
              </div>
              <div class="party-room-note" id="party-room-note-val" style="display:none"></div>
            </div>
            <div class="party-room-ctrl-btns">
              <button class="btn btn-danger btn-s" id="party-btn-leave-or-close" onclick="leaveOrCloseCurrentRoom()">🚪 退出房間</button>
            </div>
          </div>

          <!-- 全員就緒提示橫幅 -->
          <div id="party-all-ready-banner" class="party-all-ready-banner" style="display:none">
            <div class="banner-icon">🎉</div>
            <div class="banner-content">
              <div class="banner-title">全員就緒！隨時可以開玩</div>
              <div class="banner-desc">所有成員的遊戲與聯機環境已全部配置完成，祝連線愉快！</div>
            </div>
          </div>

          <!-- 成員名單區塊 -->
          <div class="party-members-section">
            <div class="section-title-bar">
              <h3>👥 房間隊伍成員</h3>
              <span class="section-subtext">成員下載狀態每 3 秒自動即時同步</span>
            </div>

            <div id="party-members-list" class="party-members-list">
              <!-- 動態填充成員清單卡片 -->
            </div>
          </div>

          <!-- 底部快捷動作工具列 -->
          <div class="party-bottom-action-bar">
            <div class="party-my-sync-status-wrap">
              <span class="my-status-label">我的本機狀態：</span>
              <span class="my-status-badge" id="party-my-status-badge">未下載</span>
            </div>

            <!-- 🌟 本機即時進度條與詳細進度狀態 (填補長空白區域) -->
            <div class="party-my-progress-container" id="party-my-progress-container">
              <div class="party-my-progress-info">
                <span class="party-my-progress-stage" id="party-my-progress-stage">準備就緒</span>
                <span class="party-my-progress-pct" id="party-my-progress-pct">0%</span>
              </div>
              <div class="party-my-progress-bar-outer">
                <div class="party-my-progress-bar-inner" id="party-my-progress-bar-inner" style="width:0%"></div>
              </div>
            </div>

            <!-- 🚀 核心主動作按鈕：一鍵安裝 (取得房主 Discord Webhook 整合包並自動部署入庫與套用補丁) -->
            <div class="party-sync-btn-wrap" id="party-sync-btn-wrap" style="display:none">
              <button class="btn btn-party-install" id="party-btn-start-sync" onclick="startSyncCurrentGameInstall()">
                🚀 一鍵安裝
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
