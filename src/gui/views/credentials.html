<div class="page" id="p-credentials">
  <!-- 頂部標題與核心操作列 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
    <div>
      <h2 style="margin:0;display:flex;align-items:center;gap:8px">
        <span>🪪</span><span>跨平台帳號與憑證配額管理</span>
      </h2>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-p btn-s" onclick="startDualPlatformSandboxLogin()" style="font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 3px 12px rgba(255,102,153,.35)">
        <span>🔑</span><span>登入 / 綁定 Discord</span>
      </button>
      <button class="btn btn-o btn-s" onclick="syncRyuuAllQuotas()" style="display:flex;align-items:center;gap:6px" title="從 Ryuu 官方伺服器同步即時配額">
        <span>🔄</span><span>同步配額</span>
      </button>
      <button class="btn btn-o btn-s" onclick="clearInvalidCreds()" style="display:flex;align-items:center;gap:6px" title="清理過期與無效之憑證記錄">
        <span>🧹</span><span>清理過期</span>
      </button>
      <button class="btn btn-o btn-s" onclick="loadCredentialsStatus(true)" title="重新整理所有帳號與即時配額狀態">
        <span>⚡</span><span>重新整理</span>
      </button>
    </div>
  </div>

  <!-- 🌟 現代化跨平台配額順位矩陣卡片 -->
  <div class="cred-matrix-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="matrix-card-title">
        <span>📊</span><span>帳號配額矩陣 (多平台狀態總覽)</span>
      </div>
      <div class="matrix-card-hints">
        <span style="display:flex;align-items:center;gap:4px"><span style="color:#2E7D32">●</span> 配額正常</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="color:#FF6699">🖐️</span> 可拖曳表頭欄位自訂檢視排版</span>
      </div>
    </div>
    <div id="cred-matrix-table-wrap">
      <div style="text-align:center;padding:36px 0;color:var(--gray);font-size:12.5px">⏳ 正在載入帳號與配額矩陣…</div>
    </div>
  </div>
</div>
