<div class="page" id="p-manage">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
  <h2 style="margin:0">📋 管理入庫</h2>
  <span id="mc" style="font-size:12px;color:var(--gray)"></span>
  <div id="manage-quota-box" class="manage-quota-strip" style="display:inline-flex;align-items:center;gap:6px"></div>
  <div style="display:inline-flex;align-items:center;gap:6px">
    <select id="manage-sort-mode" onchange="changeManageSort()">
      <option value="default">🔽 預設排序 (可更新優先)</option>
      <option value="onlinefix">🎮 聯機優先 (支援聯機置頂)</option>
      <option value="deployed">✅ 部署優先 (已部署置頂)</option>
    </select>
    <select id="view-mode" onchange="toggleView()"><option value="grid">田 網格</option><option value="list">📄 列表</option></select>
  </div>
  <div style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">
    <button class="btn btn-s btn-manifest-diag" onclick="openManifestLogModal()" title="檢視最近一次 Manifest 更新的全鏈路診斷報告">📄 診斷日誌</button>
    <button id="btn-manage-refresh" class="btn btn-p btn-s" onclick="rg(true);" title="重新載入入庫清單並強制主動比對 SteamDB 最新 Manifest">🔄 檢查更新</button>
  </div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:30px">
  <div style="display:flex;align-items:center">
    <button class="btn batch-up-btn btn-s" id="btn-batch-update" style="display:none" onclick="autoUpdateAll()">⚡ 批次自動更新</button>
  </div>
  <div>
    <input id="mf" type="text" placeholder="🔍 搜尋已入庫遊戲…" style="width:200px;padding:6px 10px;border:1px solid var(--pink-light);border-radius:10px;font-size:11px;outline:none;background:var(--card);color:var(--text)" oninput="rgDebounce()">
  </div>
</div>
<!-- 🌟 即時檢查更新進度條 -->
<div id="manage-check-progress" style="display:none;background:rgba(255,255,255,0.04);border:1px solid rgba(255,152,0,0.35);border-radius:10px;padding:10px 14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,0.18)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <div style="display:inline-flex;align-items:center;gap:8px">
      <span class="spinner-sm" style="display:inline-block;width:14px;height:14px;border:2px solid #FF9800;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></span>
      <span id="manage-progress-text" style="font-size:12px;font-weight:700;color:#FF9800">正在核驗入庫遊戲版本清單…</span>
    </div>
    <span id="manage-progress-count" style="font-size:11px;color:var(--gray);font-family:monospace;font-weight:600">0 / 0 (0%)</span>
  </div>
  <div style="width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden">
    <div id="manage-progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#FF9800,#FF5722);border-radius:4px;transition:width 0.2s ease"></div>
  </div>
  <div id="manage-progress-detail" style="font-size:11px;color:var(--gray);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">準備開始核驗…</div>
</div>
<div id="glist"><div class="empty"><div class="icon">📭</div><p>暫無入庫記錄</p></div></div>
</div>

<!-- ═══ 組隊大廳 ═══ -->
