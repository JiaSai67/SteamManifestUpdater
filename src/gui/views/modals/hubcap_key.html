<div class="modal hidden" id="modal-hubcap-key" style="z-index:100060;background:rgba(0,0,0,0.52);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)" onclick="if(event.target===this)closeHubcapKeyModal()">
  <div class="modal-box" style="max-width:480px;width:92%;padding:22px;border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,0.25)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:10px;background:rgba(0,188,212,0.15);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(0,188,212,0.3);flex-shrink:0">
          🧢
        </div>
        <div>
          <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--fg)">設定 HubcapDB API Key</h3>
          <div id="modal-hubcap-subtitle" style="font-size:11.5px;color:var(--gray);margin-top:2px">請至 hubcapmanifest.com/user 複製您的個人 API 金鑰</div>
        </div>
      </div>
      <button class="btn btn-o btn-xs" onclick="closeHubcapKeyModal()" style="border-radius:50%;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer">✕</button>
    </div>

    <!-- 🌟 快捷沙盒登入推薦橫幅 -->
    <div style="background:linear-gradient(135deg,rgba(0,188,212,0.1),rgba(0,150,136,0.06));border:1.5px dashed rgba(0,188,212,0.4);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <div style="font-size:12.5px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:6px">
          <span>⚡</span> <span>推薦：無痕沙盒自動登入</span>
        </div>
        <div style="font-size:11px;color:var(--gray);margin-top:2px;line-height:1.4">
          自動開獨立無痕視窗、預填已記憶帳密、自動捕獲並綁定 API Key
        </div>
      </div>
      <button type="button" class="btn btn-p btn-s" onclick="startHubcapSandboxLogin()" style="background:linear-gradient(135deg,#00bcd4,#0097a7);box-shadow:0 3px 12px rgba(0,188,212,0.35);flex-shrink:0;font-weight:700">
        🔑 立即快捷登入
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="height:1px;flex:1;background:rgba(0,0,0,0.08)"></div>
      <span style="font-size:11px;color:var(--gray);font-weight:600">或 手動輸入 API 金鑰</span>
      <div style="height:1px;flex:1;background:rgba(0,0,0,0.08)"></div>
    </div>

    <div style="margin-bottom:14px">
      <label style="font-size:12px;font-weight:700;display:block;margin-bottom:6px;color:var(--fg)">API 金鑰 (Bearer Token)：</label>
      <input type="password" id="input-hubcap-api-key" placeholder="在此貼上您的 Hubcap API 金鑰…" style="width:100%;padding:10px 12px;border:1.5px solid var(--pink-light);border-radius:10px;font-size:12px;font-family:Consolas,monospace;outline:none;background:var(--bg);color:var(--fg);box-sizing:border-box">
      <div style="font-size:11px;color:var(--gray);margin-top:6px;line-height:1.5">
        💡 留空並點擊「儲存」可清除現有金鑰。系統會於儲存時自動進行即時連線驗證。
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06)">
      <button type="button" class="btn btn-o btn-s" onclick="pywebview.api.open_url('https://hubcapmanifest.com/user')">
        🔗 前往官網後台
      </button>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-o btn-s" onclick="closeHubcapKeyModal()">取消</button>
        <button type="button" class="btn btn-p btn-s" onclick="submitHubcapApiKey()">儲存並驗證</button>
      </div>
    </div>
  </div>
</div>
